plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.server'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.server'
        minSdk 19
        targetSdk 28
        versionCode 13
        versionName '2.1.1'
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
